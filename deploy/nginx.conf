# =============================================================================
# Modelo de configuração do Nginx — Impressão Digital
#
# Instalação:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/impressaodigital
#   sudo ln -s /etc/nginx/sites-available/impressaodigital /etc/nginx/sites-enabled/
#   (edite os server_name abaixo com o seu domínio)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seudominio.com -d www.seudominio.com -d db.seudominio.com
# =============================================================================

# Aplicação (site principal)
server {
    listen 80;
    server_name seudominio.com www.seudominio.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }
}

# Supabase self-hosted (API + Studio) — acesso pelas chaves do novo banco
server {
    listen 80;
    server_name db.seudominio.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }
}
